<div id="splash" onclick="this.classList.add('hidden')">
    <img class="splash-logo" alt="Idle Football Manager" src="logo.png"/>
    <div class="splash-bar"><div></div></div>
    <p class="splash-hint">Warming up...</p>
</div>

<div id="app">
    <game-header v-if="init"></game-header>
    <tutorial v-if="showTutorial"></tutorial>
    <transition name="window-grow">
        <window-season v-if="init && showSeasonSummary && lastSeason" @closed="showSeasonSummary = false"></window-season>
    </transition>
    <player-compare v-if="init"></player-compare>
    <signing-stamp v-if="init"></signing-stamp>
    <live-score v-if="init"></live-score>
    <main>
        <transition name="tab-fade" mode="out-in">
            <component :is="tab"></component>
        </transition>
    </main>
</div>
